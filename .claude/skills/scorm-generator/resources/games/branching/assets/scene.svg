<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" preserveAspectRatio="xMidYMid slice">
  <!-- A neutral placeholder: a quiet room with a counter and shelves, muted so words on panels stay the thing to read. -->
  <rect width="1280" height="720" fill="#dfe6ee"/>
  <rect y="470" width="1280" height="250" fill="#c9d3de"/>
  <!-- Window light -->
  <rect x="120" y="90" width="300" height="220" rx="12" fill="#eef3f8" stroke="#b6c3d1" stroke-width="10"/>
  <path d="M270 90v220M120 200h300" stroke="#b6c3d1" stroke-width="8"/>
  <!-- Shelves -->
  <g fill="#b9c6d4">
    <rect x="820" y="110" width="360" height="14" rx="4"/>
    <rect x="820" y="230" width="360" height="14" rx="4"/>
    <rect x="820" y="350" width="360" height="14" rx="4"/>
  </g>
  <g fill="#cbd5e0" stroke="#aebccb" stroke-width="5">
    <rect x="840" y="56" width="70" height="54" rx="6"/>
    <rect x="930" y="70" width="90" height="40" rx="6"/>
    <rect x="1050" y="50" width="100" height="60" rx="6"/>
    <rect x="850" y="176" width="110" height="54" rx="6"/>
    <rect x="990" y="190" width="70" height="40" rx="6"/>
    <rect x="1090" y="170" width="70" height="60" rx="6"/>
    <rect x="860" y="300" width="80" height="50" rx="6"/>
    <rect x="970" y="290" width="120" height="60" rx="6"/>
  </g>
  <!-- The counter -->
  <rect x="0" y="520" width="1280" height="36" fill="#a9b8c8"/>
  <rect x="0" y="556" width="1280" height="164" fill="#b8c5d3"/>
  <path d="M0 600h1280" stroke="#a9b8c8" stroke-width="6"/>
</svg>

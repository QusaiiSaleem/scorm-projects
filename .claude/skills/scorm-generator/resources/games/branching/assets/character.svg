  <!-- Body -->
  <path d="M46 248c0-58 34-92 82-92s82 34 82 92z" fill="#4f6d8f" stroke="#1d2a3a" stroke-width="7"/>
  <path d="M108 160l20 26 20-26" fill="none" stroke="#1d2a3a" stroke-width="6" stroke-linejoin="round"/>
  <!-- Neck and head -->
  <rect x="112" y="128" width="32" height="34" rx="12" fill="#e9c39b" stroke="#1d2a3a" stroke-width="7"/>
  <circle cx="128" cy="92" r="46" fill="#e9c39b" stroke="#1d2a3a" stroke-width="7"/>
  <!-- Hair -->
  <path d="M82 88c0-30 20-50 46-50s46 20 46 50c-10-14-26-22-46-22s-36 8-46 22z" fill="#3b2a22" stroke="#1d2a3a" stroke-width="7" stroke-linejoin="round"/>
  <!-- Eyes, brows, mouth: a plain face, neither glad nor cross; the game marks the mood beside it -->
  <ellipse cx="111" cy="96" rx="5" ry="6.5" fill="#1d2a3a"/>
  <ellipse cx="145" cy="96" rx="5" ry="6.5" fill="#1d2a3a"/>

  <path d="M116 117h24" fill="none" stroke="#1d2a3a" stroke-width="6" stroke-linecap="round"/>
  <!-- The box held in both hands -->
  <rect x="78" y="186" width="100" height="62" rx="6" fill="#d9b382" stroke="#1d2a3a" stroke-width="7"/>
  <path d="M78 206h100M128 186v20" stroke="#1d2a3a" stroke-width="5"/>
  <circle cx="74" cy="214" r="13" fill="#e9c39b" stroke="#1d2a3a" stroke-width="7"/>
  <circle cx="182" cy="214" r="13" fill="#e9c39b" stroke="#1d2a3a" stroke-width="7"/>

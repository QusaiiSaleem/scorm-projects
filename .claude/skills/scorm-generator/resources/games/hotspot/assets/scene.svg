<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <!-- The hotspot game's placeholder scene: a home kitchen, flat cartoon with a
       dark outline (catch's pictures' style). 16:9, opaque. The sample's spots
       sit on the things they name: x and y are fractions of 1600 and 900.
       Each hazard has a SAFE TWIN elsewhere in the room, the same thing done
       right, so only the picture tells them apart. -->
  <g stroke="#2b1b12" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
    <!-- Wall and floor -->
    <rect x="-10" y="-10" width="1620" height="620" fill="#f1e4c8" stroke="none"/>
    <rect x="-10" y="600" width="1620" height="310" fill="#c79a6b" stroke="none"/>
    <g stroke="#a97c50" stroke-width="4" fill="none">
      <path d="M0 680h1600M0 770h1600M0 860h1600"/>
      <path d="M260 600v80M640 680v90M1020 600v80M380 770v90M900 770v90M1380 680v90"/>
    </g>
    <path d="M-10 600h1620" stroke-width="8"/>
    <!-- Window (o1: 270,210) -->
    <rect x="150" y="90" width="240" height="240" rx="10" fill="#8a6a4a"/>
    <rect x="172" y="112" width="196" height="196" fill="#9fd3ea"/>
    <path d="M270 112v196M172 210h196" stroke-width="10"/>
    <path d="M196 140l40-22M196 236l40-22" stroke="#e8f6fc" stroke-width="8"/>
    <rect x="140" y="326" width="260" height="20" rx="6" fill="#a8835c"/>
    <!-- Wall clock (o2: 620,130) -->
    <circle cx="620" cy="130" r="52" fill="#fffaf0"/>
    <path d="M620 130v-32M620 130l22 14" stroke-width="7"/>
    <g fill="#2b1b12" stroke="none">
      <circle cx="620" cy="88" r="5"/><circle cx="662" cy="130" r="5"/><circle cx="620" cy="172" r="5"/><circle cx="578" cy="130" r="5"/>
    </g>
    <!-- High shelf; on it, medicine CLOSED, out of reach (o8: 480,300) -->
    <rect x="430" y="330" width="180" height="16" rx="5" fill="#a8835c"/>
    <path d="M450 346l14 18M590 346l-14 18" stroke-width="6"/>
    <rect x="458" y="282" width="44" height="48" rx="8" fill="#f6f2ea"/>
    <rect x="458" y="296" width="44" height="18" fill="#e85d3d"/>
    <rect x="462" y="270" width="36" height="14" rx="4" fill="#fffaf0"/>
    <rect x="532" y="294" width="46" height="36" rx="8" fill="#9fd3ea"/>
    <!-- Socket, one plug, its cord along the wall (o7: 500,480) -->
    <rect x="470" y="440" width="60" height="80" rx="8" fill="#fffaf0"/>
    <rect x="484" y="462" width="32" height="36" rx="6" fill="#e9e2d0"/>
    <path d="M500 498v102" fill="none" stroke-width="6"/>
    <!-- Upper cabinets -->
    <rect x="1040" y="60" width="330" height="170" rx="10" fill="#d8b98f"/>
    <path d="M1205 60v170" />
    <path d="M1180 140v30M1230 140v30" stroke-width="8"/>
    <!-- Wall lamp (o3: 1480,200) -->
    <path d="M1480 250v-40" stroke-width="8"/>
    <rect x="1462" y="246" width="36" height="16" rx="4" fill="#8a6a4a"/>
    <path d="M1436 210l18-60h52l18 60z" fill="#f6c95b"/>
    <!-- Socket with many cords (h2: 760,470) -->
    <rect x="730" y="430" width="60" height="80" rx="8" fill="#fffaf0"/>
    <rect x="712" y="452" width="96" height="44" rx="8" fill="#e9e2d0"/>
    <g fill="none" stroke-width="6">
      <path d="M724 496c-10 40-30 60-60 104"/>
      <path d="M748 496c0 40-6 70-12 104"/>
      <path d="M772 496c4 44 22 70 30 104"/>
      <path d="M796 496c18 30 44 58 70 104"/>
    </g>
    <g fill="#2b1b12" stroke="none">
      <rect x="718" y="462" width="14" height="22" rx="3"/><rect x="742" y="462" width="14" height="22" rx="3"/>
      <rect x="766" y="462" width="14" height="22" rx="3"/><rect x="790" y="462" width="14" height="22" rx="3"/>
    </g>
    <!-- Counter, cabinets and stove -->
    <rect x="1020" y="410" width="590" height="190" fill="#b8875a"/>
    <path d="M1200 410v190M1400 410v190"/>
    <path d="M1180 470v40M1220 470v40M1380 470v40M1420 470v40" stroke-width="8"/>
    <rect x="1010" y="388" width="610" height="26" rx="6" fill="#e9e2d0"/>
    <rect x="1070" y="372" width="240" height="20" rx="6" fill="#4a4a52"/>
    <!-- Pot, its handle out past the counter's edge (h1: 975,324) -->
    <path d="M1090 300h110v62c0 8-6 12-12 12h-86c-6 0-12-4-12-12z" fill="#c9cdd6"/>
    <rect x="1080" y="290" width="130" height="16" rx="6" fill="#aeb3bf"/>
    <rect x="938" y="314" width="158" height="20" rx="10" fill="#4a4a52"/>
    <!-- Saucepan, its handle over the counter (o6: 1265,340) -->
    <path d="M1225 318h70v44c0 8-6 12-12 12h-46c-6 0-12-4-12-12z" fill="#c9cdd6"/>
    <rect x="1217" y="308" width="86" height="14" rx="5" fill="#aeb3bf"/>
    <rect x="1292" y="330" width="80" height="16" rx="8" fill="#4a4a52"/>
    <path d="M1125 282c-6-14 6-22 0-36M1165 282c-6-14 6-22 0-36M1260 296c-6-12 6-18 0-30" fill="none" stroke="#fffaf0" stroke-width="6" opacity="0.9"/>
    <!-- Knives in their block (o9: 1428,350) -->
    <path d="M1416 300h8v28h-8zM1428 296h8v32h-8zM1440 302h8v26h-8z" fill="#2b1b12"/>
    <path d="M1402 388l12-62h44l-2 62z" fill="#8a6a4a"/>
    <!-- Towel -->
    <path d="M1460 414h60v70l-14 12h-46z" fill="#e85d3d"/>
    <!-- Low table -->
    <rect x="300" y="640" width="440" height="24" rx="6" fill="#a8835c"/>
    <path d="M330 664v130M710 664v130" stroke-width="18"/>
    <!-- Medicine, open, pills out (h4: 360,612) -->
    <rect x="330" y="584" width="44" height="58" rx="8" fill="#f6f2ea"/>
    <rect x="330" y="600" width="44" height="22" fill="#e85d3d"/>
    <rect x="384" y="626" width="32" height="16" rx="5" fill="#fffaf0"/>
    <g fill="#fffaf0"><ellipse cx="432" cy="634" rx="9" ry="6"/><ellipse cx="450" cy="630" rx="9" ry="6"/></g>
    <!-- Fruit bowl (o4: 560,615) -->
    <circle cx="530" cy="604" r="20" fill="#e85d3d"/>
    <circle cx="568" cy="598" r="22" fill="#f6c95b"/>
    <circle cx="598" cy="608" r="18" fill="#7fbf5a"/>
    <path d="M498 612h124c-6 28-30 30-62 30s-56-2-62-30z" fill="#8a6a4a"/>
    <!-- Knife, its handle past the table's edge (h5: 735,640) -->
    <path d="M664 632h56v12h-56c-12 0-18-6-18-6s6-6 18-6z" fill="#dfe3ea"/>
    <rect x="716" y="628" width="74" height="20" rx="8" fill="#2b1b12"/>
    <!-- Plant in a pot (o5: 90,690) -->
    <path d="M90 700c-40-30-60-70-46-112 26 18 42 50 46 112zM90 700c40-30 60-70 46-112-26 18-42 50-46 112zM90 700c-6-46 0-86 0-120 8 34 6 74 0 120z" fill="#5e9a41"/>
    <path d="M52 700h76l-12 92h-52z" fill="#c8643c"/>
    <!-- Water on the floor, a sign beside it (o10: 528,810) -->
    <ellipse cx="480" cy="848" rx="84" ry="20" fill="#9fd3ea"/>
    <path d="M548 852l22-92h20l22 92z" fill="#f6c95b"/>
    <path d="M580 784v32" stroke-width="8"/>
    <circle cx="580" cy="834" r="4" fill="#2b1b12" stroke="none"/>
    <!-- Water on the floor, nothing beside it (h3: 1180,800) -->
    <ellipse cx="1180" cy="802" rx="124" ry="32" fill="#9fd3ea"/>
    <ellipse cx="1290" cy="836" rx="34" ry="10" fill="#9fd3ea"/>
    <path d="M1112 794c20-8 50-10 80-6" fill="none" stroke="#e8f6fc" stroke-width="6"/>
  </g>
</svg>

<!-- Slide Line Art Component (one continuous line that BECOMES each slide)
     ====================================================================
     A single continuous "one-line" drawing is the VISUAL for each slide. On
     the first slide it draws itself in; on every navigation the SAME line
     MORPHS into the next slide's drawing (Loooop-style continuous-line art).

     This is different from line-draw-background.html:
       - line-draw-background.html  = ONE line that keeps EXTENDING across slides.
       - slide-line-art.html (this) = ONE line that RESHAPES into a NEW picture
                                       for each slide (draw-in, then morph).

     REQUIRES:
       - base.css (theme tokens) — or your own stroke color
       - engine/slide-controller.js
       - engine/line-art.js   (the SlideLineArt draw-in + morph driver)

     THE SIGNATURE LOOK (see reference art): a thin line enters flat from the
     LEFT edge at a baseline, weaves up into the figure, and exits flat to the
     RIGHT edge. Author each pose that way so the line feels like it flows
     through the whole composition.

     ---------------------------------------------------------------------------
     HOW TO USE
       1. Put the <svg class="line-art-bg"> as the FIRST child of .sco-content
          so it sits behind the slides.
       2. Give it ONE shape per slide, in slide order, via the shapes array in
          the wiring script below.
       3. Include engine/line-art.js after slide-controller.js, then
          art.attachTo(controller). Done.

     WHERE THE FIGURES COME FROM (choose one):
       A. GENERATE with the studio's SVG pipeline (best, matches reference art):
            python3 .claude/skills/scorm-generator/scripts/generate_svg.py \
              --prompt "single continuous one-line drawing of a person doing a
                        deep squat, side view, one unbroken stroke that enters
                        flat from the left edge and exits flat to the right,
                        no fills, 2px stroke, minimalist, 1280x720" \
              --style line-icon --no-animated --output squat.svg
          Then copy the <path d="..."> out of squat.svg into the shapes array.
          (Requires GEMINI_API_KEY; without it the script writes a placeholder.)
       B. DROP IN a designer's continuous-line SVG the same way — paste its
          single <path> `d` string into the array.
       C. HAND-AUTHOR on the 1280x720 viewBox (the presets below are examples).

     Shapes do NOT need matching point counts — the morph resamples both paths
     by arc length, so ANY two single-line drawings interpolate smoothly.
-->

<style>
  .line-art-bg{
    position:absolute; inset:0; width:100%; height:100%;
    z-index:0; pointer-events:none; overflow:visible;
  }
  /* Thin, confident stroke — the drawing IS the subject here, so opacity is
     high (unlike the ambient background variant). Recolor via your theme. */
  .line-art-bg .line-path{
    fill:none;
    stroke: var(--color-text, #141821);
    stroke-width:2.6;
    stroke-linecap:round;
    stroke-linejoin:round;
    opacity:.9;
  }
  /* Pen dot rides the tip during the initial draw-in only. */
  .line-art-bg .pen{ fill: var(--color-accent, #e4572e); opacity:0; transition:opacity .2s ease; }

  /* Keep slide content above the drawing; place text to one side so the
     figure stays visible (see .slide padding in your course CSS). */
  .sco-content > .slide{ position:relative; z-index:1; }

  @media (prefers-reduced-motion: reduce){ .line-art-bg .pen{ display:none; } }
</style>

<!-- ===== The single line (starts as the flat baseline, then draws in) ===== -->
<svg id="line-bg" class="line-art-bg" viewBox="0 0 1280 720"
     preserveAspectRatio="xMidYMid meet" aria-hidden="true" focusable="false">
  <path class="line-path" d="M -40 590 L 1320 590"></path>
  <circle class="pen" r="6"></circle>
</svg>

<!-- sr-only caption: announces each slide's drawing to screen readers.
     Put this once, anywhere in the SCO body. -->
<div class="sr-only" id="lineCaption" aria-live="polite"></div>

(function(){
  function init(){
    if (typeof SlideLineArt === 'undefined') return;
    var art = new SlideLineArt({
      path: '#line-bg .line-path',
      pen: '#line-bg .pen',
      caption: '#lineCaption',
      shapes: window.EXERCISE_SHAPES,   // ONE per slide, in order
      drawInDuration: 1200,             // ms for the first slide to draw in
      morphDuration: 850                // ms for each slide-to-slide morph
    });

    // Sync to your SlideController so the line morphs on every slide change.
    if (window.__slideController) {
      art.attachTo(window.__slideController);
    }
    window.__lineArt = art;
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
